# inventory.ini — fill in your host IPs
[webservers]
# web-01 ansible_host=192.168.1.10

[databases]
# db-01 ansible_host=192.168.1.20

[monitoring]
# mon-01 ansible_host=192.168.1.30

[devops]
# ci-01 ansible_host=192.168.1.40

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
