- name: Play — all [update]
  hosts: all
  become: yes
  gather_facts: true
  tags: [update]

  roles:
    - role: common
      tags: [update]

- name: Play — dev-env [web, install, enable]
  hosts: dev-env
  become: yes
  gather_facts: true
  tags: [web, install, enable]

  roles:
    - role: nginx_setup
      tags: [web, install, enable]

- name: Play — prod-env [db, install, enable]
  hosts: prod-env
  become: yes
  gather_facts: true
  tags: [db, install, enable]

  roles:
    - role: mysql_setup
      tags: [db, install, enable]

- name: Play — nginx-node [devops, install, enable]
  hosts: nginx-node
  become: yes
  gather_facts: true
  tags: [devops, install, enable]

  roles:
    - role: ansible_setup
      tags: [devops, install, enable]
    - role: terraform_setup
      tags: [devops, install, enable]
